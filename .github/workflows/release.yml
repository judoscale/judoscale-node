name: release-please

on:
  push:
    branches:
      - main
  # Re-run npm publish (e.g. after a partial release failure) without creating a new release.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    # workflow_dispatch can target any branch in the UI; only run on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Publish when release-please cuts a release, or when manually re-triggered.
      - uses: actions/checkout@v6
        if: ${{ fromJSON(steps.release.outputs.releases_created) || github.event_name == 'workflow_dispatch' }}

      - uses: actions/setup-node@v6
        if: ${{ fromJSON(steps.release.outputs.releases_created) || github.event_name == 'workflow_dispatch' }}
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: bin/publish
        if: ${{ fromJSON(steps.release.outputs.releases_created) || github.event_name == 'workflow_dispatch' }}
        env:
          NPM_CONFIG_PROVENANCE: true
